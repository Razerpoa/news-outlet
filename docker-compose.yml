name: kabar-nusantara

services:
  web:
    # image: razorcut777/drekszone:latest
    build:
      context: ./web
    container_name: kn-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Database = Supabase via API (PostgREST). Isi SUPABASE_URL dan
      # SUPABASE_SERVICE_ROLE_KEY di .env (lihat .env.example).
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Opsional — hanya dipakai seed untuk auto-buat skema saat start.
      # Bisa dikosongkan bila skema sudah dibuat (tempel web/scripts/schema.sql
      # di SQL editor Supabase); aplikasi sendiri hanya butuh SUPABASE_* di atas.
      DATABASE_URL: ${DATABASE_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Login redaksi via Google OAuth — isi kredensial di .env (lihat .env.example)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Penulis tambahan yang diizinkan login, dipisah koma (opsional)
      AUTHOR_EMAILS: ${AUTHOR_EMAILS:-}
      # Identitas situs (opsional) — brand + detail redaksi/kontak untuk halaman
      # /about, /terms, /contact (kosong = baris terkait disembunyikan).
      # CATATAN: teks brand yang ter-bundle di sisi klien hanya berubah setelah
      # image di-rebuild (docker compose up --build); sisanya cukup restart.
      NEXT_PUBLIC_SITE_BRAND_NAME: ${NEXT_PUBLIC_SITE_BRAND_NAME:-}
      SITE_EDITOR_IN_CHIEF: ${SITE_EDITOR_IN_CHIEF:-}
      SITE_MANAGING_EDITOR: ${SITE_MANAGING_EDITOR:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      CONTACT_EMAIL_EDITORIAL: ${CONTACT_EMAIL_EDITORIAL:-}
      CONTACT_EMAIL_ADS: ${CONTACT_EMAIL_ADS:-}
      CONTACT_PHONE: ${CONTACT_PHONE:-}
      CONTACT_ADDRESS: ${CONTACT_ADDRESS:-}
    ports:
      - "${WEB_PORT:-3000}:3000"

# MTU jaringan Docker disesuaikan dengan uplink host (mis. VPN/tunnel dengan
# MTU 1420). Bila MTU container 1500 > MTU uplink, paket besar (mis. handshake
# TLS ke Google) hilang diam-diam — gejalanya: koneksi TCP berhasil tapi
# fetch ke layanan eksternal menggantung/timeout. Sesuaikan angka ini bila
# uplink Anda berubah (cek: ip link show eth0 | grep mtu).
networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: 1400
