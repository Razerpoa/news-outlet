name: kabar-nusantara-prod

services:
  web:
    image: razorcut777/drekszone:latest
    container_name: kn-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Database = Supabase (PostgreSQL terkelola) — isi DATABASE_URL di .env (lihat .env.example)
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTHOR_EMAILS: ${AUTHOR_EMAILS:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
