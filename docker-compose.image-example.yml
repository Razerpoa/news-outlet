name: kabar-nusantara-prod

services:
  web:
    image: razorcut777/drekszone:latest
    container_name: kn-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Database = Supabase via API (PostgREST). Isi SUPABASE_URL dan
      # SUPABASE_SERVICE_ROLE_KEY di .env (lihat .env.example).
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Opsional — hanya dipakai seed untuk auto-buat skema saat start.
      DATABASE_URL: ${DATABASE_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTHOR_EMAILS: ${AUTHOR_EMAILS:-}
      NEXT_PUBLIC_SITE_BRAND_NAME: ${NEXT_PUBLIC_SITE_BRAND_NAME:-}
      SITE_EDITOR_IN_CHIEF: ${SITE_EDITOR_IN_CHIEF:-}
      SITE_MANAGING_EDITOR: ${SITE_MANAGING_EDITOR:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      CONTACT_EMAIL_EDITORIAL: ${CONTACT_EMAIL_EDITORIAL:-}
      CONTACT_EMAIL_ADS: ${CONTACT_EMAIL_ADS:-}
      CONTACT_PHONE: ${CONTACT_PHONE:-}
      CONTACT_ADDRESS: ${CONTACT_ADDRESS:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
