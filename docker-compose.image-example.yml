name: kabar-nusantara-prod

services:
  db:
    image: postgres:16-alpine
    container_name: kn-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kabar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kabar_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kabar_nusantara}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kabar} -d ${POSTGRES_DB:-kabar_nusantara}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    image: razorcut777/drekszone:latest
    container_name: kn-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kabar}:${POSTGRES_PASSWORD:-kabar_secret}@db:5432/${POSTGRES_DB:-kabar_nusantara}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTHOR_EMAILS: ${AUTHOR_EMAILS:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
